<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ChefEar · 조리 진행</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<main class="screen">
  <div class="brand">
    <span class="pot">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3c0 1.5 1 2 1 3M8 3c0 1.5 1 2 1 3M12 3c0 1.5 1 2 1 3"/><path d="M3 9h18v2a8 8 0 0 1-8 8h-2a8 8 0 0 1-8-8V9Z"/><line x1="1" y1="9" x2="3" y2="9"/><line x1="21" y1="9" x2="23" y2="9"/></svg>
    </span>
    <span class="name">ChefEar</span>
  </div>

  <span class="badge">된장찌개 · 3 / 5 단계</span>

  <div class="card">
    <div class="dots">
      <span class="dot done"></span>
      <span class="dot done"></span>
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
    <p class="step-title">감자를 한입 크기로 썰어<br />냄비에 넣어주세요</p>
    <div class="time-chip">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      약 2분
    </div>
    <div class="player">
      <button class="play-btn" aria-label="다시 듣기">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>
      </button>
      <span class="wave" aria-hidden="true">
        <span style="height:6px"></span><span style="height:10px"></span><span style="height:16px"></span>
        <span style="height:24px"></span><span style="height:14px"></span><span style="height:22px"></span>
        <span style="height:28px"></span><span style="height:18px"></span><span style="height:26px"></span>
        <span style="height:12px"></span><span style="height:20px"></span><span style="height:9px"></span>
        <span style="height:16px"></span><span style="height:24px"></span><span style="height:14px"></span>
        <span style="height:8px"></span><span style="height:12px"></span><span style="height:6px"></span>
        <span style="height:10px"></span><span style="height:6px"></span>
      </span>
    </div>
  </div>

  <div class="section-title">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18M12 3v3M7 5v1M17 5v1"/><path d="M4 11l1.2 8.4A2 2 0 0 0 7.2 21h9.6a2 2 0 0 0 2-1.6L20 11"/></svg>
    오늘의 재료
  </div>
  <div class="chip-grid">
    <span class="chip"><span class="emoji">🥔</span>감자 1개</span>
    <span class="chip"><span class="emoji">🧈</span>두부 1/2모</span>
    <span class="chip"><span class="emoji">🥒</span>애호박 1/3개</span>
    <span class="chip"><span class="emoji">🫘</span>된장 1큰술</span>
    <span class="chip substituted"><span class="emoji">🧅</span>양파 1/2개 (대체)</span>
  </div>

  <div class="transcript">
    <div class="transcript-row">
      <span class="avatar user">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </span>
      <p><span class="who user">나:</span>감자 대신 양파 넣어도 돼?</p>
    </div>
    <div class="transcript-row">
      <span class="avatar ai">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
      </span>
      <p><span class="who ai">ChefEar:</span>네, 양파로 대체했어요.</p>
    </div>
  </div>

  <div class="mic-bar">
    <button class="mic-btn" aria-label="듣는 중">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    </button>
    <div class="mic-status">
      <span class="state">듣는 중</span>
      <span class="hint">다음 · 다시 · 재료 바꾸기</span>
    </div>
  </div>

  <div class="control-row">
    <a class="control-btn" href="03_cooking_step.html">이전</a>
    <a class="control-btn" href="03_cooking_step.html">다시</a>
    <a class="control-btn" href="10_complete.html">다음</a>
  </div>

  <div style="display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:16px;">
    <a class="footer-nav" style="position:static;" href="04_substitution_confirm.html">예시: “바지락 넣어도 돼?”</a>
    <a class="footer-nav" style="position:static;" href="05_no_match.html">예시: 매칭 실패</a>
    <a class="footer-nav" style="position:static;" href="11_unclassified.html">예시: 음성 인식 실패</a>
  </div>

  <a class="footer-nav" href="flowmap.html">전체 화면 흐름 보기</a>
</main>
</body>
</html>
