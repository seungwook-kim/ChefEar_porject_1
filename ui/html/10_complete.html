<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ChefEar · 완료</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<main class="screen">
  <div class="brand">
    <span class="pot">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3c0 1.5 1 2 1 3M8 3c0 1.5 1 2 1 3M12 3c0 1.5 1 2 1 3"/><path d="M3 9h18v2a8 8 0 0 1-8 8h-2a8 8 0 0 1-8-8V9Z"/><line x1="1" y1="9" x2="3" y2="9"/><line x1="21" y1="9" x2="23" y2="9"/></svg>
    </span>
    <span class="name">ChefEar</span>
  </div>

  <div style="flex:1; display:flex; flex-direction:column; justify-content:center;">
    <span class="lead-icon positive">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="8 12.5 11 15.5 16 9"/></svg>
    </span>
    <div class="center-block" style="margin-bottom:20px;">
      <h1>저장이 완료됐어요!</h1>
      <p>다음에 이 요리를 찾으면 회원님 버전으로 먼저 안내해드릴게요.</p>
    </div>

    <div class="badge-row">
      <span class="status-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        원본 레시피 보존됨
      </span>
      <span class="status-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        나만의 레시피로 저장됨
      </span>
    </div>

    <div class="card" style="text-align:center;">
      <p style="margin:0; font-size:13.5px; color:var(--text-secondary); line-height:1.6;">
        원본(api_standard)은 그대로 남고, 회원님이 바꾼 내용은 user_custom으로 별도 저장돼요.
        다음 조회부터는 개인 버전이 우선 제공돼요 (FR-08).
      </p>
    </div>
  </div>

  <div class="btn-row">
    <a class="btn btn-primary" href="01_start.html">처음 화면으로</a>
  </div>

  <a class="footer-nav" href="flowmap.html">전체 화면 흐름 보기</a>
</main>
</body>
</html>
